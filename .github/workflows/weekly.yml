# Runs the job-market tracker every Monday: tests the rules, collects new postings,
# saves the new numbers to history/ and rebuilds the public dashboard (docs/index.html).
name: Weekly job market update

on:
  schedule:
    - cron: "17 5 * * 1"      # every Monday at 05:17 UTC (07:17 in Berlin in summer)
  workflow_dispatch:           # adds a "Run workflow" button, so you can also start it by hand

permissions:
  contents: write              # allows the robot to save the history files back to the repo

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install packages
        run: pip install -r requirements.txt

      - name: Check the text rules still work
        run: python -m pytest -q tests

      - name: Run the pipeline
        env:
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
        run: python pipeline.py

      - name: Rebuild the public dashboard
        run: python build_dashboard.py

      - name: Keep this week's raw data for 90 days (private, downloadable from the run page)
        uses: actions/upload-artifact@v4
        with:
          name: raw-data-${{ github.run_id }}
          path: data/
          retention-days: 90

      - name: Save the updated history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add history/ docs/index.html
          git diff --cached --quiet || git commit -m "Weekly update: $(date -u +%Y-%m-%d)"
          git push
